<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">SUPERCAR</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="models.html">Models</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<section class="split-section">

    <div class="split-text">

        <div class="contact-card">

            <h1>Contact Us</h1>

            <p>
                Have questions about our supercars? Our team is ready to assist
                you with information about models, performance, and availability.
            </p>

            <form>

                <input
                    type="email"
                    placeholder="Your Email"
                    required
                >

                <input
                    type="password"
                    placeholder="Password"
                    required
                >

                <textarea
                    placeholder="Your Message"
                    rows="5"
                    required
                ></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>

    </div>

    <div class="split-image">
        <img
            src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1200"
            alt="Supercar"
        >
    </div>

</section>

</body>
</html>
